<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <script>
    (function () {
      var path = window.location.pathname;
      if (path === "/daynav/" || path === "/daynav" || path === "/daynav/index.html") {
        window.location.replace("/daynav%2F");
      }
    })();
  </script>
  <style>
    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background: #f4f5f7;
      color: #1f2937;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 620px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.45rem;
    }

    p {
      margin: 0 0 12px;
      color: #4b5563;
      line-height: 1.5;
    }

    a {
      color: #0f766e;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      color: #115e59;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The URL you requested does not exist on this site.</p>
    <p>If you were trying to open daynav, use <a href="/daynav%2F">/daynav/</a>.</p>
  </main>
</body>
</html>
