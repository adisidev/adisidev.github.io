<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Adi's XR Bio - Interactive</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-environment-component@1.3.1/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene xr-mode-ui="enabled: true">
      <!-- Camera with cursor for gaze interaction -->
      <a-entity camera look-controls>
        <a-entity
          cursor="fuse: true; fuseTimeout: 1000"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
          material="color: #FF5722; shader: flat">
        </a-entity>
      </a-entity>

      <!-- Panels (initially all hidden except panel7) -->
      <a-entity id="panel0" visible="false">
        <a-box width="2.8" height="0.5" depth="0.05" color="#222" opacity="0.7" position="0 1.6 -3"></a-box>
        <a-text value="Dear Dr. Chek Tien Tan," width="2.5" align="center" position="0 1.6 -2.97" color="#fff"></a-text>
      </a-entity>
      <a-entity id="panel1" visible="false">
        <a-box width="2.8" height="0.7" depth="0.05" color="#222" opacity="0.7" position="0 1.6 -3"></a-box>
        <a-text value="I'm Adi Singhania, a Research Engineer currently working with Associate Professor Michael Gastner at SIT." width="2.5" align="center" position="0 1.6 -2.97" color="#fff"></a-text>
      </a-entity>
      <a-entity id="panel2" visible="false">
        <a-box width="2.8" height="1.3" depth="0.05" color="#222" opacity="0.7" position="0 1.6 -3"></a-box>
        <a-text value="I love gamification. In my free time, I've often perused gamification literature (some less academic like Yu-kai Chou or Game Maker's Toolkit and some more) in an attempt to gamify different areas of my own life (mainly productivity and working out). I also love XR. I have my own Meta Quest 3, and I really think XR (particularly, AR/MR), once advanced enough, will be the most salient way humans will interact with computers." width="2.5" align="center" position="0 1.6 -2.97" color="#fff"></a-text>
      </a-entity>
      <a-entity id="panel3" visible="false">
        <a-box width="2.8" height="0.9" depth="0.05" color="#222" opacity="0.7" position="0 1.6 -3"></a-box>
        <a-text value="Thus, I was quite excited when I found out that the Centre for Immersification has a Research Engineer position listed on SIT's job board that lines up well with the end date of my current contract!" width="2.5" align="center" position="0 1.6 -2.97" color="#fff"></a-text>
      </a-entity>
      <a-entity id="panel4" visible="false">
        <a-box width="2.8" height="1.1" depth="0.05" color="#222" opacity="0.7" position="0 1.6 -3"></a-box>
        <a-text value="I'll be frank: although I do love gamification and XR, I haven't gotten the chance to conduct research within those fields yet. That being said, most of my research work has revolved around programming in C++/Vue.js/Python, as well as writing papers on Cartograms and the related computer graphics techniques required to achieve them." width="2.5" align="center" position="0 1.6 -2.97" color="#fff"></a-text>
      </a-entity>
      <a-entity id="panel5" visible="false">
        <a-box width="2.8" height="1.2" depth="0.05" color="#222" opacity="0.7" position="0 1.6 -3"></a-box>
        <a-text value="I noticed that you use C++/CMake, Typescript and Python quite extensively in a many of your repositories over at https://github.com/singaporetech, and https://www.immersification.org/jobs/ lists academic writing and computer graphics as desired skills. Thus, I hope my previous experience will still prove fruitful in my efforts to contribute to your project!" width="2.5" align="center" position="0 1.6 -2.97" color="#fff"></a-text>
      </a-entity>
      <a-entity id="panel6" visible="false">
        <a-box width="2.8" height="1.0" depth="0.05" color="#222" opacity="0.7" position="0 1.6 -3"></a-box>
        <a-text value="I'm truly excited about the possibility of working with you and contributing to the Centre for Immersification. Please let me know if you'd be open to a conversation sometime next week - I'd love to discuss how I can contribute to your team. In the meanwhile, I've 'hidden' my CV herewith for your reference (with two papers absent as they are currently under review)." width="2.5" align="center" position="0 1.6 -2.97" color="#fff"></a-text>
      </a-entity>
      <a-entity id="panel7" visible="false">
        <a-box width="2.8" height="1.1" depth="0.05" color="#222" opacity="0.7" position="0 1.6 -3"></a-box>
        <a-text value="P.S. I would also like to be upfront and mention that I'm a foreigner. That being said, there are a few bureaucratic niceties that prevent that from being too intrusive. In particular, since I already have an Employment Pass (EP) with SIT that is valid until late 2026, HR would not have to apply for a new pass, and you would not have to pay the S-Pass levy that is usually associated with hiring foreigners." width="2.5" align="center" position="0 1.6 -2.97" color="#fff"></a-text>
      </a-entity>

      <!-- Gaze Button and Prompt (always visible at start) -->
      <a-entity id="gaze-group" visible="true">
        <a-sphere id="gaze-button-bg" radius="0.25" color="#FF5722" opacity="0.85" position="0 0 0"></a-sphere>
        <a-entity
          geometry="primitive: sphere; radius: 0.26"
          material="opacity: 0"
          position="0 0 0"
          class="gazeable"
        ></a-entity>
      </a-entity>

      <!-- Text in front of the player -->
      <a-entity id="orange-sphere-text" visible="true">
        <a-text value="Look at the orange sphere to continue" width="2" align="center" color="#222" position="0 -0.4 -2.5"></a-text>
      </a-entity>

      <!-- Text in front of the player -->
      <a-entity id="cv-text" visible="false">
        <a-text value="Look behind you." width="2" align="center" color="#222" position="0 -0.4 -2.5"></a-text>
      </a-entity>

      <!-- Text behind the player -->
      <a-entity id="blue-sphere-text" visible="true">
        <a-text value="Look at the blue sphere to download my CV" width="2" align="center" color="#222" position="0 0.4 2.5"></a-text>
      </a-entity>

      <!-- Blue sphere for CV -->
      <a-entity id="cv-sphere" position="0 0.6 3">
        <a-sphere radius="0.3" color="#0000FF" opacity="0.85"></a-sphere>
        <a-entity
          geometry="primitive: sphere; radius: 0.31"
          material="opacity: 0"
          position="0 0 0"
          class="cv-gazeable"
        ></a-entity>
      </a-entity>

      <a-sky color="#ECECEC"></a-sky>
      <a-entity environment="preset: forest; groundColor: #445; skyColor: #ccf"></a-entity>

      <script>
        // Panels data
        const panelIds = [
          "panel0", "panel1", "panel2", "panel3",
          "panel4", "panel5", "panel6", "panel7"
        ];
        let currentPanel = -1; // Start before the first panel

        // Button positions for each step (first: off-center and higher)
        const gazePositions = [
          {x: -1,   y: 1.4, z: -2.5},  // Start (no panel)
          {x: 0.2,  y: 0.4, z: -3},    // Panel 0
          {x: 1.2,  y: 0.5, z: -2.7},  // Panel 1
          {x: -1.1, y: 0.3, z: -2.5},  // Panel 2
          {x: 0.5,  y: 0.5, z: -3.2},  // Panel 3
          {x: -0.5, y: 0.6, z: -2.8},  // Panel 4
          {x: 0.8,  y: 0.0, z: -2.9},  // Panel 5
          {x: -0.7, y: 0.2, z: -2.6},  // Panel 6
          {x: 0,    y: 0.6, z: -3.1}   // Panel 7
        ];

        function updateGazeButton() {
          let gazeGroup = document.getElementById('gaze-group');
          let turnAroundText = document.getElementById('cv-text');
          let pos = gazePositions[currentPanel + 1];
          gazeGroup.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
          gazeGroup.setAttribute('visible', currentPanel < panelIds.length);

          // Toggle visibility of orange sphere text
          document.getElementById('orange-sphere-text').setAttribute('visible', currentPanel === -1);

          // Hide orange sphere once panel6 is displayed
          if (currentPanel === 7) {
            gazeGroup.setAttribute('visible', false);
            turnAroundText.setAttribute('visible', true);
          }
        }

        function showCurrentPanel() {
          panelIds.forEach((id, idx) => {
            document.getElementById(id).setAttribute('visible', idx === currentPanel);
          });
          updateGazeButton();
        }

        function nextPanel() {
          if (currentPanel < panelIds.length - 1) {
            currentPanel++;
            showCurrentPanel();
          }
        }

        document.addEventListener('DOMContentLoaded', function () {
          document.querySelector('#gaze-group .gazeable').addEventListener('click', nextPanel);

          // Add event listener for CV sphere
          document.querySelector('#cv-sphere .cv-gazeable').addEventListener('click', function () {
            window.location.href = "https://adisinghania.com/cvs/Adi Singhania for Centre for Immersification.pdf";
          });
        });

        showCurrentPanel();
      </script>
    </a-scene>
  </body>
</html>
